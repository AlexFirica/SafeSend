<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSend Dashboard</title>
    <link rel="stylesheet" href="styleDashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>SafeSend</h2>
            <nav>
                <button class="nav-btn active">Dashboard</button>
                <button class="nav-btn">Setări</button>
            </nav>
<div class="user-info">
    <p>ID-ul tău:</p>
    <code id="my-id-display">Se încarcă...</code>
    <p>Cheia ta publică:</p>
    <textarea class="exported-key" readonly rows="4"></textarea>
</div>
        </aside>

        <main class="content">
            <header>
                <h1>Fișierele mele</h1>
                <div id="message" class="status-msg"></div>
            </header>

            <section class="send-section">
                <h3>Trimite un fișier nou</h3>
                <div class="send-controls">
                    <select id="recipientSelect">
                        <option value="" disabled selected>Selectează Destinatar</option>
                    </select>
                    
                    <label for="fileInput" class="custom-file-upload">
                        Alege fișier
                    </label>
                    <input type="file" id="fileInput">
                    
                    <span id="file-name-display">Niciun fișier selectat</span>
<button id="sendBtn">Trimite</button>
                </div>
            </section>

            <section class="files-grid" id="files-grid">
                <div class="empty-state">Nu ai primit niciun fișier încă.</div>
            </section>
        </main>
    </div>
    <script src="backend/src/config/test.js"></script>
    <script src="testareid.js"></script>
    <script src="backend/src/backendAPI.js" type="application/json"></script>
    <script type="module">
    import { loadRecipients, getRecipientPublicKey, loadReceivedFiles, decryptAndDownload } from '/db_manager.js';
    
    window.getRecipientPublicKey = getRecipientPublicKey;

    window.addEventListener('DOMContentLoaded', async () => {
        await loadRecipients();
        
        // Show truncated version of local client identity
        const myId = localStorage.getItem("id") || "N/A";
        document.getElementById("my-id-display").textContent = myId.substring(0, 13) + "...";
        
        // Load exclusively user files & update display interface grid
        await renderDashboard();
    });

    async function renderDashboard() {
        const grid = document.getElementById("files-grid");
        grid.innerHTML = ""; // Clear placeholder loading elements

        try {
            // Fetch records where receiver_id == authenticated user
            const files = await loadReceivedFiles();

            if (!files || files.length === 0) {
                grid.innerHTML = '<div class="empty-state">Nu ai primit niciun fișier încă.</div>';
                return;
            }

            files.forEach(file => {
                const card = document.createElement("div");
                card.className = "file-card";
                
                // Color configuration mapping based on the AI Risk Label
                let colorClass = "badge-gray";
                if (file.ai_label === "Green") colorClass = "badge-green";
                if (file.ai_label === "Yellow") colorClass = "badge-yellow";
                if (file.ai_label === "Red") colorClass = "badge-red";

                card.innerHTML = `
                    <div class="file-info">
                        <span class="file-icon">📄</span>
                        <div class="file-details">
                            <h4>${file.file_path || 'Fișier Protejat'}</h4>
                            <p>Primit la: ${new Date(file.upload_date).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="security-status">
                        <span class="badge ${colorClass}">Scor: ${file.ai_risk_score ?? 'N/A'}/100 (${file.ai_label || 'Incert'})</span>
                        <button class="download-btn" id="dl-${file.file_id}">Descarcă</button>
                    </div>
                `;

                grid.appendChild(card);

                // Attach cryptographic decryption trigger execution maps
                document.getElementById(`dl-${file.file_id}`).addEventListener("click", async () => {
                    await decryptAndDownload(file);
                });
            });

        } catch (error) {
            console.error("Dashboard render failed:", error);
            grid.innerHTML = '<div class="empty-state" style="color: red;">Eroare la încărcarea fișierelor.</div>';
        }
    }
</script>
</body>
</html>
